[project]
name = "sui-ai"
version = "0.1.0"
description = "AI Coding Agent Runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "psycopg[binary]>=3.3.4",
    "google-genai>=2.14.0",
    "rich>=15.0.0",
]

keywords = ["ai", "agent", "llm", "coding", "terminal"]

urls = { Homepage = "https://github.com/midsane/sui", Repository = "https://github.com/midsane/sui" }

authors = [{ name = "Aditya Raj / midsane" }]

license = "MIT"
license-files = ["LICENSE"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.scripts]
sui = "app.terminal.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.20",
    "poethepoet>=0.48.0",
    "poe>=0.1.0",
]

[tool.poe.tasks]
lint = "pre-commit run --all-files"
start = "uv run python -m app.main"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"

strict = true

warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
